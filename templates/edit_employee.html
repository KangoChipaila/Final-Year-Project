{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
    <h2 class="text-xl font-bold mb-4">Edit Employee</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Name</label>
            <input type="text" name="name" value="{{ employee.name }}" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Department</label>
            <input type="text" name="department" value="{{ employee.department }}" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Role</label>
            <input type="text" name="role" value="{{ employee.role }}" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Email</label>
            <input type="email" name="email" value="{{ employee.email }}" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Phone</label>
            <input type="text" name="phone" value="{{ employee.phone }}" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="Active" {% if employee.status == 'Active' %}selected{% endif %}>Active</option>
                <option value="On Leave" {% if employee.status == 'On Leave' %}selected{% endif %}>On Leave</option>
                <option value="Inactive" {% if employee.status == 'Inactive' %}selected{% endif %}>Inactive</option>
            </select>
        </div>
        <button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800">Save Changes</button>
        <a href="{{ url_for('human_resources_overview') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
</section>
{% endblock %}
