{% extends "base.html" %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
  <h2 class="text-xl font-bold mb-4">Add Payment</h2>
  <form method="POST">
    {{ csrf_token() }}
    <div class="mb-4">
      <label>Party / Payee</label>
      <input name="party" required class="w-full" />
    </div>
    <div class="mb-4">
      <label>Due / Payment Date</label>
      <input name="due_date" type="date" required class="w-full" />
    </div>
    <div class="mb-4">
      <label>Amount</label>
      <input name="amount" type="number" step="0.01" required class="w-full" />
    </div>
    <div class="mb-4">
      <label>Status</label>
      <select name="status" class="w-full">
        <option>Pending</option>
        <option selected>Paid</option>
      </select>
    </div>
    <div class="flex justify-end">
      <button class="btn btn-primary" type="submit">Save</button>
    </div>
  </form>
</section>
{% endblock %}
