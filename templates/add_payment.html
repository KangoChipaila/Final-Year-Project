{% extends "base.html" %}
{% block title %}Add Payment{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-lg">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Add Payment</h1>
    <form method="POST" class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Party / Payee</label>
            <input name="party" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Due / Payment Date</label>
            <input name="due_date" type="date" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Amount</label>
            <input name="amount" type="number" step="0.01" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>Pending</option>
                <option selected>Paid</option>
            </select>
        </div>

        <div class="flex justify-end gap-4">
            <a href="{{ url_for('accounting_overview') }}" class="text-gray-600 hover:text-gray-800 px-4 py-2">Cancel</a>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Save Payment</button>
        </div>
    </form>
</div>
{% endblock %}
