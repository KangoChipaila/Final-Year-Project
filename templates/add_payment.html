{% extends "base.html" %}
{% block title %}Add Payment{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
    <h2 class="text-xl font-bold mb-4">Add Payment</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Vendor/Customer</label>
            <input type="text" name="party" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Due Date</label>
            <input type="date" name="due_date" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Amount</label>
            <input type="number" name="amount" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="Pending">Pending</option>
                <option value="Received">Received</option>
            </select>
        </div>
        <button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800">Add Payment</button>
        <a href="{{ url_for('finance_overview') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
</section>
{% endblock %}
