{% extends "base.html" %}
{% block title %}Add Receipt{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
    <h2 class="text-xl font-bold mb-4">Add Receipt</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Date</label>
            <input type="date" name="date" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Description</label>
            <input type="text" name="description" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Inflow</label>
            <input type="number" name="inflow" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Balance</label>
            <input type="number" name="balance" required class="w-full border rounded px-3 py-2">
        </div>
        <button type="submit" class="bg-green-700 text-white px-4 py-2 rounded hover:bg-green-800">Add Receipt</button>
        <a href="{{ url_for('finance_overview') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
</section>
{% endblock %}
