{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-20">
    <h1 class="text-6xl font-bold text-blue-600">404</h1>
    <p class="text-2xl text-gray-700 mt-4">Page Not Found</p>
    <p class="text-gray-500 mt-2">The page you are looking for does not exist.</p>
    <a href="{{ url_for('index') }}" class="mt-6 inline-block bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Go Home</a>
</div>
{% endblock %}
