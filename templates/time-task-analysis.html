{% extends "base.html" %}
{% block title %}Time-Task Analysis{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-6xl">
  <h1 class="text-2xl font-bold mb-4">Time-Task Analysis</h1>

  <form id="tta-form" class="mb-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <input name="date_from" type="date" class="border p-2 rounded" />
      <input name="date_to" type="date" class="border p-2 rounded" />
      <input name="task_types" placeholder="task types (csv)" class="border p-2 rounded" />
    </div>
    <div class="mt-3">
      <button id="run-tta" class="px-4 py-2 bg-indigo-600 text-white rounded">Run Analysis</button>
    </div>
  </form>

  <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">By Task Type</h3>
      <pre id="task-type-json" class="text-sm"></pre>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">Work Center Utilization</h3>
      <div id="wc-chart" style="height:320px"></div>
      <pre id="wc-json" class="text-sm mt-2"></pre>
    </div>
  </section>

  <section class="bg-white p-4 rounded shadow mt-6">
    <h3 class="font-semibold mb-2">Recent Events</h3>
    <div id="events-table"></div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
document.getElementById('tta-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const data = new FormData(e.target);
  const params = {};
  for (const [k,v] of data.entries()) if (v) params[k]=v;
  const resp = await fetch('/api/task_events/analysis', {method:'POST', body: new URLSearchParams(params), credentials:'same-origin'});
  if (!resp.ok) { alert('Analysis failed'); return; }
  const json = await resp.json();
  document.getElementById('task-type-json').textContent = JSON.stringify(json.by_task_type, null, 2);
  document.getElementById('wc-json').textContent = JSON.stringify(json.work_center_utilization, null, 2);
  const wc = json.work_center_utilization || [];
  const labels = wc.map(x=>String(x.work_center_id));
  const vals = wc.map(x=>x.util_percent);
  Plotly.newPlot('wc-chart',[{x:labels,y:vals,type:'bar'}],{title:'Work center utilization (%)'});
});

// load recent events
async function loadRecentEvents(){
  const resp = await fetch('/api/task_events?per_page=20', {credentials:'same-origin'});
  if (!resp.ok) return;
  const j = await resp.json();
  const rows = j.events || [];
  const table = document.createElement('table');
  table.className = 'min-w-full text-sm';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr class="bg-gray-100"><th class="px-2 py-1">ID</th><th>Task</th><th>Type</th><th>Event</th><th>Time</th><th>Duration(s)</th></tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="px-2 py-1">${r.id}</td><td class="px-2 py-1">${r.task_id||''}</td><td class="px-2 py-1">${r.task_type||''}</td><td class="px-2 py-1">${r.event_type||''}</td><td class="px-2 py-1">${r.timestamp||''}</td><td class="px-2 py-1">${r.duration_seconds||''}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  const container = document.getElementById('events-table');
  container.innerHTML = '';
  container.appendChild(table);
}
loadRecentEvents();
</script>
{% endblock %}
