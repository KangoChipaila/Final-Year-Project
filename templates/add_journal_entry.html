{% extends "base.html" %}
{% block title %}Add Journal Entry{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-lg">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">New Journal Entry</h1>
    <form method="POST" class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Date</label>
            <input type="date" name="date" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Description</label>
            <input type="text" name="description" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Debit Account</label>
                <select name="debit_account_id" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <option value="">Select...</option>
                    {% for acc in accounts %}
                    <option value="{{ acc.id }}">{{ acc.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Credit Account</label>
                <select name="credit_account_id" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <option value="">Select...</option>
                    {% for acc in accounts %}
                    <option value="{{ acc.id }}">{{ acc.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2">Amount</label>
            <input type="number" step="0.01" name="amount" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div class="flex justify-end gap-4">
            <a href="{{ url_for('accounting_overview') }}" class="text-gray-600 hover:text-gray-800 px-4 py-2">Cancel</a>
            <button type="submit" class="bg-gray-700 text-white px-6 py-2 rounded hover:bg-gray-800 transition">Post Entry</button>
        </div>
    </form>
</div>
{% endblock %}
