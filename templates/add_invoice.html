{% extends "base.html" %}
{% block title %}Create Invoice{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-lg">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Create Customer Invoice</h1>
    <form method="POST" class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Customer</label>
            <select name="customer_id" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <option value="">-- Select Customer --</option>
                {% for cust in customers %}
                <option value="{{ cust.id }}">{{ cust.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Invoice Date</label>
                <input type="date" name="date" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Due Date</label>
                <input type="date" name="due_date" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Total Amount</label>
            <input type="number" step="0.01" name="amount" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="Unpaid">Unpaid</option>
                <option value="Paid">Paid</option>
                <option value="Overdue">Overdue</option>
                <option value="Draft">Draft</option>
            </select>
        </div>
        <div class="flex justify-end gap-4">
            <a href="{{ url_for('accounting_overview') }}" class="text-gray-600 hover:text-gray-800 px-4 py-2">Cancel</a>
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700 transition">Create Invoice</button>
        </div>
    </form>
</div>
{% endblock %}
