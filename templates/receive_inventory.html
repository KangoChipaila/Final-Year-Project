{% extends "base.html" %}
{% block title %}Receive Inventory{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
    <h2 class="text-xl font-bold mb-4">Receive Inventory</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Product</label>
            <input type="text" name="product" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">SKU</label>
            <input type="text" name="sku" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Warehouse</label>
            <input type="text" name="warehouse" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Quantity</label>
            <input type="number" name="quantity" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Reorder Level</label>
            <input type="number" name="reorder_level" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="In Stock">In Stock</option>
                <option value="Low Stock">Low Stock</option>
                <option value="Out of Stock">Out of Stock</option>
            </select>
        </div>
        <button type="submit" class="bg-gray-700 text-white px-4 py-2 rounded hover:bg-gray-800">Receive</button>
        <a href="{{ url_for('distribution_overview') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
</section>
{% endblock %}
