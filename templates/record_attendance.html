{% extends "base.html" %}
{% block title %}Record Attendance{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
    <h2 class="text-xl font-bold mb-4">Record Attendance</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Date</label>
            <input type="date" name="date" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Employee</label>
            <select name="employee" class="w-full border rounded px-3 py-2">
                {% for employee in employees %}
                <option value="{{ employee.name }}">{{ employee.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Check In</label>
            <input type="time" name="check_in" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Check Out</label>
            <input type="time" name="check_out" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="On Leave">On Leave</option>
            </select>
        </div>
        <button type="submit" class="bg-black text-white px-4 py-2 rounded hover:bg-gray-800">Record</button>
        <a href="{{ url_for('human_resources_overview') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
</section>
{% endblock %}
