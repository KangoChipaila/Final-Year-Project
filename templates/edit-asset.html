{% extends "base.html" %}
{% block title %}Edit Asset{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Edit Asset</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="mb-4 p-3 rounded 
                    {% if category == 'error' %}bg-red-100 text-red-700
                    {% elif category == 'success' %}bg-green-100 text-green-700
                    {% else %}bg-gray-100 text-gray-700{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <form action="{{ url_for('edit_asset', asset_id=asset.id) }}" method="POST" class="space-y-4">
        <div>
            <label for="name" class="block font-medium text-gray-700">Asset Name</label>
            <input type="text" name="name" id="name" value="{{ asset.name }}" required
                   class="w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-300 focus:outline-none">
        </div>

        <div>
            <label for="category" class="block font-medium text-gray-700">Category</label>
            <input type="text" name="category" id="category" value="{{ asset.category }}" required
                   class="w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-300 focus:outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="purchase_date" class="block font-medium text-gray-700">Purchase Date</label>
                <input type="date" name="purchase_date" id="purchase_date" value="{{ asset.purchase_date }}" required
                       class="w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-300 focus:outline-none">
            </div>

            <div>
                <label for="value" class="block font-medium text-gray-700">Value (ZMW)</label>
                <input type="number" name="value" id="value" step="0.01" value="{{ asset.value }}" required
                       class="w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-300 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="depreciation_rate" class="block font-medium text-gray-700">Depreciation Rate (%)</label>
                <input type="number" name="depreciation_rate" id="depreciation_rate" step="0.01" value="{{ asset.depreciation_rate }}"
                       class="w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-300 focus:outline-none">
            </div>

            <div>
                <label for="status" class="block font-medium text-gray-700">Status</label>
                <select name="status" id="status" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-300 focus:outline-none">
                    <option value="Active" {% if asset.status == "Active" %}selected{% endif %}>Active</option>
                    <option value="Retired" {% if asset.status == "Retired" %}selected{% endif %}>Retired</option>
                </select>
            </div>
        </div>

        <div class="flex justify-end mt-6 space-x-3">
            <a href="{{ url_for('asset_overview') }}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">Cancel</a>
            <button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800 transition">Save Changes</button>
        </div>
    </form>
</section>
{% endblock %}
