<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href = "{{ url_for ('static', filename = 'css/styles.css')}}" />
    <script src = "https://cdn.plot.ly/plotly-latest.min.js"></script>
  </head>
  <body>
    <div id = "dashboard">
            {% include 'partials/drawer.html' %}
            <div class="sales-overview">
                <section class="top-content">
                    <div class="page-title">
                        <div class = "module-title">DASHBOARD</div>
                    </div>
                    <div class = "user-details">
                        <div class = "user-info">USERNAME</div>
                        <img class = "user-display-image" src = "{{url_for('static', filename = 'images/display picture.jpg')}}" alt = "user-display-image" />
                    </div>
                </section>
                <section id = "dashboard-main-content">
                  <div id = "sales-analytics-dashboard-summary"></div>
                  <div id="customer-dashboard-summary"></div>        
                </section>
            </div>
    </div>

    <footer id = "footer">
      <img class = "footer-logo" src = "{{ url_for ('static', filename = 'images/logo.jpg')}}" />
      <div class="about">
        <p>Copyright 2025</p>
      </div>
    </footer>
    
    <script>
      var salesTrendGraph = {{ sales_trend_graph | tojson}};
      var customerGraph = {{ customers | tojson}};

      Plotly.newPlot('sales-analytics-dashboard-summary', salesTrendGraph.data, salesTrendGraph.layout);
      Plotly.newPlot('customer-dashboard-summary', customerGraph.data, customerGraph.layout);
    </script>
  </body>
</html>
