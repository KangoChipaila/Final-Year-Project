<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href = "{{ url_for ('static', filename = 'css/styles.css')}}" />
    <script src = "https://cdn.plot.ly/plotly-latest.min.js"></script>
  </head>
  <body>
    <div id = "dashboard">
            <div class = "drawer">
                <a class = "home-logo" href = "/"><img class = "logo" src = "{{ url_for ('static', filename = 'images/logo.jpg')}}" alt = "Company Logo Here" /></a>
                <div class="dashboard">
                    <a href = "/"><p>DASHBOARD</p></a>
                </div>
                <details class = "accordion-item">
                    <summary>ACCOUNTING</summary>
                    <div>
                        <div>
                            <a href = "/accounting-overview"><p>Overview</p></a>
                        </div>
                    </div>
                </details>
                <details class = "accordion-item">
                    <summary>ASSETS</summary>
                    <div>
                        <div>
                            <a href = "/assets-overview"><p>Overview</p></a>
                        </div>
                    </div>
                </details>
                <details class = "accordion-item">
                    <summary>CUSTOMERS</summary>
                    <div>
                        <div>
                            <a href = "/customer-overview"><p>Overview</p></a>
                        </div>
                    </div>
                </details>
                <details class = "accordion-item">
                    <summary>DISTRIBUTION</summary>
                    <div>
                        <div>
                            <a href = "/distribution-overview"><p>Overview</p></a>
                        </div>
                    </div>
                </details>
                <details class = "accordion-item">
                    <summary>FINANCE</summary>
                    <div>
                        <div>
                            <a href = "/finance-overview"><p>Overview</p></a>
                        </div>
                    </div>
                </details>
                <details class = "accordion-item">
                    <summary>HUMAN RESOURCES</summary>
                    <div>
                        <div>
                            <a href = "/human-resources-overview"><p>Overview</p></a>
                        </div>
                    </div>
                </details>
                <details class = "accordion-item">
                    <summary>PROCUREMENT</summary>
                    <div>
                        <div>
                            <a href = "/procurement-overview"><p>Overview</p></a>
                        </div>
                    </div>
                </details>
                <details class = "accordion-item">
                    <summary>PRODUCTION</summary>
                    <div>
                        <div>
                            <a href = "/production-overview"><p>Overview</p></a>
                        </div>
                    </div>
                </details>
                <details class = "accordion-item">
                    <summary>SALES</summary>
                    <div>
                        <a href = "/sales-overview"><p>Overview</p></a>
                        <a href = "/detailed-sales-analytics"><p>Detailed Sales Analytics</p></a>
                    </div>
                </details>
                
            </div>
            <div class="sales-overview">
                <section class="top-content">
                    <div class="page-title">
                        <div class = "module-title">DASHBOARD</div>
                    </div>
                    <div class = "user-details">
                        <div class = "user-info">USERNAME</div>
                        <img class = "user-display-image" src = "{{url_for('static', filename = 'images/display picture.jpg')}}" alt = "user-display-image" />
                    </div>
                </section>
                <section id = "dashboard-main-content">
                  <div id = "sales-analytics-dashboard-summary"></div>
                  <div id="customer-dashboard-summary"></div>        
                </section>
            </div>
    </div>

    <footer id = "footer">
      <img class = "footer-logo" src = "{{ url_for ('static', filename = 'images/logo.jpg')}}" />
      <div class="about">
        <p>Copyright 2025</p>
      </div>
    </footer>
    
    <script>
      var salesTrendGraph = {{ sales_trend_graph | tojson}};
      var customerGraph = {{ customers | tojson}};

      Plotly.newPlot('sales-analytics-dashboard-summary', salesTrendGraph.data, salesTrendGraph.layout);
      Plotly.newPlot('customer-dashboard-summary', customerGraph.data, customerGraph.layout);
    </script>
  </body>
</html>
