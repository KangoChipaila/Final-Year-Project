<!DOCTYPE html>
<html>
    <head>
        <title>Detailed Sales Analytics</title>
        <script src = "https://cdn.plot.ly/plotly-latest.min.js"></script>
        <link rel = "stylesheet" href = "{{ url_for ('static', filename = 'css/styles.css')}}" />
        <link rel = "stylesheet" href = "{{ url_for ('static', filename = 'css/output.css')}}" />
    </head>

    <body>
        <div id = "sales-page">
            {% include 'partials/drawer.html' %}
            <div class="sales-overview">
                <section class="top-content">
                    <div class="page-title">
                        <div class = "module-title">SALES</div>
                        <div class = "submodule-title">Detailed Sales Analytics</div>
                    </div>
                    <div class = "user-details">
                        <div class = "user-info">USERNAME</div>
                        <img class = "user-display-image" src = "{{url_for('static', filename = 'images/display picture.jpg')}}" alt = "user-display-image" />
                    </div>
                </section>
                <section>
                    <div id="sales-forecast">
                        {{ sales_forecast | safe }}
                    </div>
                </section>
            </div>
        </div>
        <footer id = "footer">
            <img class = "footer-logo" src = "{{ url_for ('static', filename = 'images/logo.jpg')}}" />
            <div class="about">
                <p>Copyright 2025</p>
            </div>
        </footer>
        
        <script>
            var salesForecastGraph = {{ sales_forecast }};

            Plotly.newPlot('sales-forecast', salesForecastGraph.data, salesForecastGraph.layout)
        </script>
    </body>
