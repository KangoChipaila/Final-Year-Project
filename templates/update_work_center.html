{% extends "base.html" %}
{% block title %}Update Work Center{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
    <h2 class="text-xl font-bold mb-4">Update Work Center</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Work Center</label>
            <select name="name" class="w-full border rounded px-3 py-2">
                {% for wc in work_centers %}
                <option value="{{ wc.name }}">{{ wc.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Current Task</label>
            <input type="text" name="current_task" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="Running">Running</option>
                <option value="Idle">Idle</option>
                <option value="Maintenance">Maintenance</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Operator</label>
            <input type="text" name="operator" required class="w-full border rounded px-3 py-2">
        </div>
        <button type="submit" class="bg-gray-700 text-white px-4 py-2 rounded hover:bg-gray-800">Update</button>
        <a href="{{ url_for('production_overview') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
</section>
{% endblock %}
