{% extends "base.html" %}
{% block title %}Add BOM{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
    <h2 class="text-xl font-bold mb-4">Add Bill of Materials</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Product</label>
            <input type="text" name="product" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Component</label>
            <input type="text" name="component" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Quantity Required</label>
            <input type="number" name="quantity_required" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Unit</label>
            <input type="text" name="unit" required class="w-full border rounded px-3 py-2">
        </div>
        <button type="submit" class="bg-green-700 text-white px-4 py-2 rounded hover:bg-green-800">Add BOM</button>
        <a href="{{ url_for('production_overview') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
</section>
{% endblock %}
