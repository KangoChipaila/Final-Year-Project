{% extends "base.html" %}
{% block title %}Departments Overview{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-8 mt-8">
    <h2 class="text-2xl font-bold text-blue-700 mb-6">Departments</h2>
    <table class="min-w-full bg-white rounded-lg">
        <thead>
            <tr class="bg-black text-white text-left">
                <th class="py-3 px-4 rounded-tl-lg">Department</th>
                <th class="py-3 px-4">Employees</th>
            </tr>
        </thead>
        <tbody>
            {% for dept in departments %}
            <tr class="border-b hover:bg-gray-50 transition">
                <td class="py-2 px-4">{{ dept.name }}</td>
                <td class="py-2 px-4">{{ dept.employees }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2" class="text-center py-4 text-gray-500">No departments found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
