{% extends "base.html" %}
{% block title %}Add Production Order{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
    <h2 class="text-xl font-bold mb-4">Add Production Order</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Product</label>
            <input type="text" name="product" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Quantity</label>
            <input type="number" name="quantity" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Start Date</label>
            <input type="date" name="start_date" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">End Date</label>
            <input type="date" name="end_date" required class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>
        <button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800">Add Order</button>
        <a href="{{ url_for('production_overview') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
</section>
{% endblock %}
