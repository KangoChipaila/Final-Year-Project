{% extends "base.html" %}
{% block title %}HR Reports{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-8 mt-8">
    <h2 class="text-2xl font-bold text-blue-700 mb-6">HR Reports</h2>
    <ul class="space-y-4">
        {% for report in reports %}
        <li class="bg-gray-100 rounded-lg p-4 flex justify-between items-center">
            <span class="font-semibold text-gray-700">{{ report.title }}</span>
            <span class="text-gray-500 text-sm">{{ report.date }}</span>
            <a href="#" class="bg-blue-600 text-white px-3 py-1 rounded-lg font-semibold shadow hover:bg-blue-800 transition">Download</a>
        </li>
        {% else %}
        <li class="text-center py-4 text-gray-500">No reports available.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
